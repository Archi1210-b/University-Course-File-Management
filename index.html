        function showModal(title, message, type='error', isLoader=false) {
            const modal = document.getElementById('message-modal');
            const container = document.getElementById('modal-content-container');

            if (isLoader) {
                container.innerHTML = `<div class="flex flex-col items-center p-8">
                    <svg class="animate-spin h-8 w-8 text-muj-orange mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-700 font-semibold">${message}</p>
                </div>`;
            } else {
                const titleClasses = type === 'success' ? 'text-green-600' : 'text-red-600';
                const buttonClasses = type === 'success' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700';

                container.innerHTML = `<h3 id="modal-title" class="text-xl font-bold mb-4 ${titleClasses}">${title}</h3>
                    <p id="modal-content" class="text-gray-700 mb-6">${message}</p>
                    <button onclick="closeModal()" class="w-full py-2 text-white font-semibold rounded-lg transition-colors ${buttonClasses}">Close</button>`;
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }

        function renderContent(html) {
            document.getElementById('app').innerHTML = html;
        }

        // --- Firebase init ---
        async function initFirebase() {
            if (!firebaseConfig) {
                showModal('Configuration Error', 'Firebase configuration not available. Persistent storage disabled.', 'error');
                return;
            }
            try {
                const app = firebase.initializeApp(firebaseConfig);
                db = firebase.getFirestore(app);
                auth = firebase.getAuth(app);
                storage = firebase.getStorage(app);
            } catch (err) {
                console.error('Firebase init failed', err);
                showModal('Firebase Error', 'Failed to initialize Firebase.');
            }
        }

        function getDocumentRef(section, tabId) {
            if (!db) return null;
            const docId = `${COURSE_METADATA.courseCode}-${section}-${tabId}`;
            return firebase.doc(db, `artifacts/${appId}/public/data/courseFiles`, docId);
        }

        async function saveData() {
            if (isSaving || !db || !auth || !currentUser) return;
            const content = window.hot ? JSON.stringify(window.hot.getData()) : '';

            if (!activeSection || !activeTab) {
                showModal('Error','No section or tab selected','error');
                return;
            }

            const docRef = getDocumentRef(activeSection, activeTab);
            isSaving = true;

            try {
                // Write main document with metadata

                await firebase.setDoc(docRef, {
                    content: content,
                    lastUpdated: new Date().toISOString(),
                    updatedBy: currentUser.name,
                    role: currentRole,
                    section: activeSection
                });

                // Append to version history
                await firebase.addDoc(firebase.collection(db, 'courseFileHistory'), {
                    courseCode: COURSE_METADATA.courseCode,
                    tabId: activeTab,
                    section: activeSection,
                    content: content,
                    updatedBy: currentUser.name,
                    role: currentRole,
                    updatedAt: firebase.serverTimestamp()
                });

                showSaveSuccess();
            } catch (error) {
                console.error('Error saving', error);
                showModal('Save Error', `Failed to save data. ${error.message}`, 'error');
            } finally {
                isSaving = false;
            }
        }
   async function uploadDocument(input) {
    if (!input.files.length) return;

    const file = input.files[0];

    if (!currentUser || !activeSection || !activeTab) {
        showModal('Error', 'Missing user or section info', 'error');
        return;
    }

    const docRef = getDocumentRef(activeSection, activeTab);

    showModal('Uploading...', 'Uploading file to cloud...', null, true);

    try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_CONFIG.uploadPreset);
       
        formData.append(
            "folder",
            `${COURSE_METADATA.courseCode}/${activeSection}/${activeTab}`
        );

        const response = await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/auto/upload`,

            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();
        console.log("Cloudinary response:", data);


if (!data.secure_url) {
    throw new Error(data.error?.message || "Upload failed.");
}

        // 🔴 IMPORTANT CHECK
        if (!response.ok || !data.secure_url) {
            throw new Error(data.error?.message || "Cloudinary upload failed");
        }

        await firebase.setDoc(docRef, {
            fileName: file.name,
          fileURL: data.secure_url,

            uploadedBy: currentUser.name,
            role: currentRole,
            section: activeSection,
            uploadedAt: new Date().toISOString()
        }, { merge: true });

        closeModal();
        showModal('Success', 'File uploaded successfully!', 'success');

    } catch (err) {
        closeModal();
        console.error(err);
        showModal('Upload Failed', err.message, 'error');
    }

    input.value = '';
}





        function showSaveSuccess() {
            const statusElement = document.getElementById('save-status');
            if (statusElement) {
                statusElement.innerHTML = `<span class="text-green-600 font-semibold flex items-center"><span class="mr-2">💾</span> Saved successfully! (${new Date().toLocaleTimeString()})</span>`;
                setTimeout(()=>{
                    if(document.getElementById('save-status')) document.getElementById('save-status').innerHTML = '';
                },4000);
            }
        }

        function loadData() {
            unsubscribeSnapshot();
           if (!db || !activeSection || !activeTab) {
    currentContent = {
        content: MOCK_TEMPLATE_CONTENT
    };
    isDataLoading = false;
    renderTabDetails();
    return;
}

            
            const docRef = getDocumentRef(activeSection, activeTab);
            isDataLoading = true;
            renderTabDetails();
unsubscribeSnapshot = firebase.onSnapshot(
    docRef,
    (docSnap) => {
        isDataLoading = false;

        if (docSnap.exists()) {
            currentContent = docSnap.data();
        } else {
            currentContent = {}; // no file, no text yet
        }

        renderTabDetails();
    },
    (err) => {
        isDataLoading = false;
        currentContent = { content: `ERROR: ${err.message}` };
        renderTabDetails();
        showModal('DB Error', 'Failed to load realtime data.', 'error');
    }
);

        }

        function renderDashboard(){

                renderAdminGate();

    const fileName = currentContent.fileName;
    const textContent = currentContent.content || "";

       ${fileURL ? `
<div class="mb-4 p-4 bg-green-50 border border-green-300 rounded-lg">

       target="_blank"

</div>
` : ""}

   setTimeout(() => {
    const container = document.getElementById('spreadsheet');
    if (!container) return;

    let savedData = [];

    if (currentContent && currentContent.content) {
        try {
            savedData = JSON.parse(currentContent.content);
        } catch (e) {
            savedData = [];
        }
    }

    window.hot = new Handsontable(container, {
        data: savedData.length
            ? savedData

        contextMenu: true,
        dropdownMenu: true,
        filters: true,

        height: 400,
        licenseKey: 'non-commercial-and-evaluation'
    });

}, 100);



}

        async function handleUserLogin(event){
            event.preventDefault();

            const form = event.target;
            const emailInput = form.querySelector("#email");
if (!emailInput || !emailInput.value) {
    showModal('Error', 'Email field is empty', 'error');
    return;
}

const email = emailInput.value.trim().toLowerCase();

            const password = form.password.value;

            // Domain check
            if (!email.endsWith('@muj.manipal.edu')) {
                showModal('Invalid Email','Only @muj.manipal.edu addresses are allowed.','error');
                return;
            }

            showModal('Connecting...','Signing you in...', null, true);

            try {
                if (!db || !auth) await initFirebase();
                
                const userCred = await firebase.signInWithEmailAndPassword(auth, email, password);
                userId = userCred.user.uid;

                // fetch user metadata from users collection
                const userDocRef = firebase.doc(db, 'users', userId);
                const userSnap = await firebase.getDoc(userDocRef);

                closeModal();

                if (!userSnap.exists()) {
                    showModal('Access Denied','Your account is not registered in the users collection. Contact admin.','error');
                    await firebase.signOut(auth);
                    return;
                }

                const userData = userSnap.data();
                currentUser = {
                    name: userData.name || userCred.user.email.split('@')[0],
                    email: userCred.user.email,
                    sections: userData.sections || ['C']
                };
                
                currentRole = userData.role || currentRole || 'teacher';
                activeSection = currentUser.sections[0];
                
                showModal('Login Successful', `Welcome, ${currentUser.name}! You are logged in as a ${currentRole}.`, 'success');
                renderDashboard();

            } catch (err) {
                console.error('Login error', err);
                closeModal();
                showModal('Login Failed', err.message || 'Sign-in failed.','error');
            }
        }

        function selectTab(tabId){
            activeTab = tabId;
            renderDashboard();
        }

        function selectSection(sectionId){
            activeSection = sectionId;
            // When section changes, default back to the first allowed tab for the current role
            const availableTabs = ALL_TABS.filter(tab => tab.roles.includes(currentRole));
            activeTab = availableTabs[0].id;
            renderDashboard();
        }

        async function logout(){
            try {
                if(auth) await firebase.signOut(auth);
            } catch(e){
                console.warn(e);
            }
            currentUser = null;
            currentRole = null;
            activeSection = null;
            activeTab = 'faculty_profile';
            unsubscribeSnapshot();
            db=null;
            renderAdminGate();
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async ()=>{
            await initFirebase();
            renderAdminGate();
        });
    </script>
